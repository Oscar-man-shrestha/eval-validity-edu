name: Repository checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  research-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install test runner
        run: python -m pip install pytest
      - name: Check frozen files and research claims
        run: python -m pytest -q tests/test_prereg_integrity.py tests/test_research_integrity_audit.py
